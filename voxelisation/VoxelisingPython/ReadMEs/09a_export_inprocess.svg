orm="translate(184.3203125, 683)"><rect class="basic label-container" style="fill:#1e8449 !important;stroke:#fff !important" x="-176.3203125" y="-75" width="352.640625" height="150"/><g class="label" style="color:#fff !important" transform="translate(-146.3203125, -60)"><rect/><foreignObject width="292.640625" height="120"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 300px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p>browser, opened from file:// - Three.js<br />InstancedMesh, one mesh per class<br />render_store_3d() writes both variants:<br />label_full.html (auto-thinned) and<br />label_roi.html (200 m, max_boxes None)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-CC-6" data-look="classic" transform="translate(508.46875, 683)"><rect class="basic label-container" style="fill:#1e8449 !important;stroke:#fff !important" x="-117.828125" y="-39" width="235.65625" height="78"/><g class="label" style="color:#fff !important" transform="translate(-87.828125, -24)"><rect/><foreignObject width="175.65625" height="48"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 300px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p>CloudCompare, MeshLab<br />Blender, ParaView</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>